<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Antigravity Tab Groups</title>
  <style>
    body {
      margin: 0;
      padding: 14px;
      width: 290px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #141418;
      color: #f3f4f6;
      font-size: 13px;
    }
    h1 { font-size: 14px; margin: 0 0 4px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.16);
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    #groups { list-style: none; padding: 0; margin: 0 0 12px; }
    #groups li {
      display: flex;
      justify-content: space-between;
      padding: 6px 8px;
      margin-bottom: 4px;
      background: #1e1e26;
      border-radius: 6px;
    }
    .empty { color: #9ca3af; font-size: 12px; margin: 8px 0 12px; }
    button {
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 6px;
      background: #7c3aed;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>
  <h1>Antigravity Tab Groups</h1>
  <div class="badge">tabs + tabGroups only · 0 network calls</div>
  <div id="status" class="empty">Checking active agent groups...</div>
  <ul id="groups"></ul>
  <button id="closeAll" disabled>Close All Agent Groups</button>
  <script src="popup.js"></script>
</body>
</html>
